name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Both platforms: a package-lock.json regenerated over an existing
      # node_modules tree records only that machine's native binaries, so a
      # lock made on macOS breaks Linux installs and vice versa. Each runner
      # catches the lock the other's platform produced. Tests run on ubuntu.
      #
      # Node at both ends of the range package.json's engines admits: its
      # floor, pinned exactly (keep the two in step), so a change that needs
      # a newer Node fails here rather than for someone running the floor;
      # and the newest release. On ubuntu also each maintained Node line
      # between those two majors (24 today), since each line ships its own
      # built-in fetch.
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.12.0', 'latest']
        include:
          - os: ubuntu-latest
            node: '24'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # npm ci installs the lock verbatim: npm >= 11 'npm install' silently
      # re-resolves platform packages missing from the lock, so only npm ci
      # fails loudly on a broken or out-of-sync lockfile.
      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: npm test

      # Exercise the package manifest import in emitted JavaScript as well
      # as the source/tsx path, including both MCP and MCPL handshakes.
      - name: Test built server
        if: matrix.os == 'ubuntu-latest'
        run: node --test dist/test/server.test.js
