name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (ubuntu-latest, Node 22.12.0)
    runs-on: ubuntu-latest
    # Bounds a hung test run, which GitHub would otherwise cancel only after
    # 360 minutes. Node's test runner can loop forever reading a test file's
    # output when what it has buffered starts with V8's serializer header but
    # holds only part of a frame (nodejs/node#62704). The fix shipped in
    # 24.18.0 and 26.2.0, and no 22.x release has it as of 22.23.3.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      # npm ci installs the lock verbatim: npm >= 11 'npm install' silently
      # re-resolves platform packages missing from the lock, so only npm ci
      # fails loudly on a broken or out-of-sync lockfile.
      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Exercise the package manifest import in emitted JavaScript as well
      # as the source/tsx path, including both MCP and MCPL handshakes.
      - name: Test built server
        run: node --test dist/test/server.test.js

  install-and-start:
    name: Install & start (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # A package-lock.json regenerated over an existing node_modules tree
      # records only that machine's native binaries, so a lock made on macOS
      # breaks Linux installs and vice versa. Each platform's install catches
      # the lock the other's produced.
      matrix:
        include:
          - os: macos-latest
            node: '22.12.0'
          - os: macos-latest
            node: latest
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-latest
            node: latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start the built server without a token
        run: |
          set +e
          out=$(env -u DISCORD_TOKEN node dist/src/index.js --stdio < /dev/null 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" = 1
          test "$out" = 'DISCORD_TOKEN environment variable is required'

      # @discordjs/voice loads @snazzah/davey's native binary as it's imported.
      - name: Load the voice modules
        run: node --input-type=module -e "await import('./dist/src/voice.js'); await import('@discordjs/voice');"
